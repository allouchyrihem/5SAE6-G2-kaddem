version: '3.8'

services:
  mysqldb:
    container_name: mysqldb
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root           # Set the root user password
      MYSQL_DATABASE: kaddem
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - kaddem-network

  springboot-app:
    image: islem997/islemabderahmen_g2_kaddem
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/kaddem
      SPRING_DATASOURCE_USERNAME: root          # Use root for DB access
      SPRING_DATASOURCE_PASSWORD: root          # Use root password
    depends_on:
      - mysqldb
    networks:
      - kaddem-network

  sonar:
    image: sonarqube:latest
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    networks:
      - kaddem-network

  sonar-db:
    image: postgres:latest
    container_name: sonarqube-db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    networks:
      - kaddem-network

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: always
    ports:
      - "8081:8081"
    networks:
      - kaddem-network

networks:
  kaddem-network:
    driver: bridge

volumes:
  mysql-data:
  sonar-db-data:
  nexus-data:
